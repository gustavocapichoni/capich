<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CAPICH – Crypto Trading ∞</title>
  <link rel="shortcut icon" href="assets/icons/favicon.ico">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/tactical.css?v=3">
  <link rel="stylesheet" href="css/order_panel.css?v=3">
  <script src="https://unpkg.com/lightweight-charts@4.1.1/dist/lightweight-charts.standalone.production.js"></script>
</head>
<body>

  <!-- Indicador de admin (visível só após login) -->
  <div id="admin-indicator" class="admin-indicator" style="display:none;">
    <span>🛡️ Admin: <strong id="admin-user-name"></strong></span>
    <button class="btn-admin-sair" onclick="fazerLogout()">Sair</button>
  </div>

  <!-- Topbar -->
  <header class="topbar-binance">
    <a href="index.html" class="topbar-brand">
      <img src="assets/icons/logo.webp" alt="Logo CAPICH" class="topbar-logo">
      <div class="topbar-title-group">
        <span class="topbar-name">CAPICH</span>
        <span class="topbar-badge">
          <span>Crypto Trading</span>
          <svg class="infinity-loop-svg" viewBox="0 0 52 26" width="26" height="13" fill="none" xmlns="http://www.w3.org/2000/svg" aria-label="Infinito">
            <defs>
              <linearGradient id="inf-cor-grad-hist" x1="0%" y1="0%" x2="100%" y2="0%">
                <stop offset="0%" stop-color="#00f0ff" />
                <stop offset="30%" stop-color="#0088cc" />
                <stop offset="48%" stop-color="#060c1d" />
                <stop offset="52%" stop-color="#060c1d" />
                <stop offset="70%" stop-color="#4d077d" />
                <stop offset="100%" stop-color="#8a0ff8" />
              </linearGradient>
              <filter id="inf-glow-hist" x="-20%" y="-20%" width="140%" height="140%">
                <feDropShadow dx="0" dy="0" stdDeviation="0.8" flood-color="#8a0ff8" flood-opacity="0.6" />
                <feDropShadow dx="0" dy="0" stdDeviation="1.5" flood-color="#00f0ff" flood-opacity="0.5" />
              </filter>
              <radialGradient id="sun-flare-hist" cx="50%" cy="50%" r="50%">
                <stop offset="0%" stop-color="#ffffff" stop-opacity="1" />
                <stop offset="35%" stop-color="#ffffff" stop-opacity="0.85" />
                <stop offset="65%" stop-color="#e0f2fe" stop-opacity="0.35" />
                <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
              </radialGradient>
              <filter id="sun-soft-hist" x="-100%" y="-100%" width="300%" height="300%">
                <feGaussianBlur stdDeviation="2.2" />
              </filter>
            </defs>
            <!-- Corpo sólido e contínuo nas 3 cores -->
            <path d="M 26,13 C 21,5 8,5 8,13 C 8,21 21,21 26,13 C 31,5 44,5 44,13 C 44,21 31,21 26,13 Z"
                  stroke="url(#inf-cor-grad-hist)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"
                  filter="url(#inf-glow-hist)" />
            <!-- Brilho de luz branca suave circulando lentamente como o sol antes de nascer -->
            <circle r="6.5" fill="url(#sun-flare-hist)" filter="url(#sun-soft-hist)">
              <animateMotion dur="6.5s" repeatCount="indefinite"
                path="M 26,13 C 21,5 8,5 8,13 C 8,21 21,21 26,13 C 31,5 44,5 44,13 C 44,21 31,21 26,13 Z" />
            </circle>
            <circle r="2.2" fill="#ffffff" opacity="0.95">
              <animateMotion dur="6.5s" repeatCount="indefinite"
                path="M 26,13 C 21,5 8,5 8,13 C 8,21 21,21 26,13 C 31,5 44,5 44,13 C 44,21 31,21 26,13 Z" />
            </circle>
          </svg>
        </span>
      </div>
    </a>
    <nav class="topbar-nav">
      <a href="index.html" class="nav-link">Painel</a>
      <a href="crypto_trading_history.html" class="nav-link active">Histórico</a>
      <a href="sobre.html" class="nav-link">Sobre</a>
      <a href="metodo.html" class="nav-link">Método</a>
    </nav>
  </header>

  <!-- Menu lateral (admin only) -->
  <aside class="menu-vertical-lateral admin-only">
    <button class="menu-item-btn" onclick="criarNovaSecao()" title="Nova sessão">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <line x1="12" y1="5" x2="12" y2="19"></line>
        <line x1="5" y1="12" x2="19" y2="12"></line>
      </svg>
      <span>Nova sessão</span>
    </button>
  </aside>

  <!-- ═══════════════════════════════════════════════════
       GRÁFICO TÁTICO BTCUSDT 1H — Acumulação / Distribuição
       Inserido no topo do conteúdo, antes das sessões
  ═══════════════════════════════════════════════════ -->
  <div id="btc-tactical-section" style="width:100%;max-width:100%;margin:0 auto 12px;padding:0 8px;box-sizing:border-box"></div>

  <!-- Conteúdo principal -->
  <main id="secoes-container">
    <!-- Seções carregadas pelo Firebase -->
  </main>

  <!-- Rodapé -->
  <footer class="pagina-footer">
    <div class="footer-subscription">
      <h4>Receba novidades sobre meus produtos</h4>
      <form class="form-inscricao" onsubmit="inscreverEmail(event)">
        <input type="email" placeholder="Seu melhor email" required>
        <button type="submit">Inscrever</button>
      </form>
    </div>
    <button class="btn-admin-lock" onclick="abrirModalAdmin()" title="Acesso administrativo">🔒</button>
  </footer>

  <!-- Modal: Login admin -->
  <div id="modal-admin" class="modal-admin">
    <div class="modal-admin-content">
      <h2>Área Administrativa</h2>
      <p>Faça login com a conta Google autorizada.</p>
      <button class="btn-google-login" onclick="fazerLoginGoogle()">
        <svg viewBox="0 0 24 24" width="20" height="20" style="flex-shrink:0">
          <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
          <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
          <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
          <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
        </svg>
        Entrar com Google
      </button>
      <button class="btn-cancelar-admin" onclick="fecharModalAdmin()">Cancelar</button>
    </div>
  </div>

  <!-- Modal: Zoom de imagem -->
  <div id="modal-zoom" class="modal-zoom" onclick="fecharModalImagem()">
    <span class="modal-fechar">&times;</span>
    <img id="modal-img" src="" alt="Visualização em alta resolução">
  </div>

  <script src="js/chart_positions.js"></script>
  <script src="js/order_panel.js?v=2"></script>
  <script src="js/btc_tactical_chart.js?v=3"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
